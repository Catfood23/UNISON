name: Deploy UNISON to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unison-cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify deployment secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UNISON_GOOGLE_APPS_SCRIPT_URL: ${{ secrets.UNISON_GOOGLE_APPS_SCRIPT_URL }}
          UNISON_GOOGLE_SHARED_SECRET: ${{ secrets.UNISON_GOOGLE_SHARED_SECRET }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID UNISON_GOOGLE_APPS_SCRIPT_URL UNISON_GOOGLE_SHARED_SECRET; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Build Worker
        run: bun run build
        env:
          NITRO_PRESET: cloudflare_module

      - name: Deploy Worker
        run: bunx nitro deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Google storage secrets on Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UNISON_GOOGLE_APPS_SCRIPT_URL: ${{ secrets.UNISON_GOOGLE_APPS_SCRIPT_URL }}
          UNISON_GOOGLE_SHARED_SECRET: ${{ secrets.UNISON_GOOGLE_SHARED_SECRET }}
        run: |
          printf '%s' "$UNISON_GOOGLE_APPS_SCRIPT_URL" | bunx wrangler secret put UNISON_GOOGLE_APPS_SCRIPT_URL --name unison-civic-demo
          printf '%s' "$UNISON_GOOGLE_SHARED_SECRET" | bunx wrangler secret put UNISON_GOOGLE_SHARED_SECRET --name unison-civic-demo
