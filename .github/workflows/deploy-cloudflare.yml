name: Deploy UNISON to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unison-cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Build for Cloudflare Pages
        run: bun run build
        env:
          # cloudflare_pages preset: outputs to dist/ with _worker.js for SSR
          # This avoids the 1 MB Cloudflare Worker script size limit.
          NITRO_PRESET: cloudflare_pages

      - name: Verify deployment secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UNISON_GOOGLE_APPS_SCRIPT_URL: ${{ secrets.UNISON_GOOGLE_APPS_SCRIPT_URL }}
          UNISON_GOOGLE_SHARED_SECRET: ${{ secrets.UNISON_GOOGLE_SHARED_SECRET }}
          UNISON_ADMIN_PASSWORD: ${{ secrets.UNISON_ADMIN_PASSWORD }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID UNISON_GOOGLE_APPS_SCRIPT_URL UNISON_GOOGLE_SHARED_SECRET; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          if [ -n "$UNISON_ADMIN_PASSWORD" ] && [ "${#UNISON_ADMIN_PASSWORD}" -lt 24 ]; then
            echo "UNISON_ADMIN_PASSWORD must contain at least 24 characters"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        run: |
          bunx wrangler pages deploy dist \
            --project-name unison-civic-demo \
            --branch main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Google storage secrets on Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UNISON_GOOGLE_APPS_SCRIPT_URL: ${{ secrets.UNISON_GOOGLE_APPS_SCRIPT_URL }}
          UNISON_GOOGLE_SHARED_SECRET: ${{ secrets.UNISON_GOOGLE_SHARED_SECRET }}
        run: |
          printf '%s' "$UNISON_GOOGLE_APPS_SCRIPT_URL" | bunx wrangler pages secret put UNISON_GOOGLE_APPS_SCRIPT_URL --project-name unison-civic-demo
          printf '%s' "$UNISON_GOOGLE_SHARED_SECRET" | bunx wrangler pages secret put UNISON_GOOGLE_SHARED_SECRET --project-name unison-civic-demo

      - name: Configure admin password on Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UNISON_ADMIN_PASSWORD: ${{ secrets.UNISON_ADMIN_PASSWORD }}
        run: |
          if [ -n "$UNISON_ADMIN_PASSWORD" ]; then
            printf '%s' "$UNISON_ADMIN_PASSWORD" | bunx wrangler pages secret put UNISON_ADMIN_PASSWORD --project-name unison-civic-demo
          else
            echo "UNISON_ADMIN_PASSWORD is not configured; the admin dashboard will remain locked."
          fi
